<!doctype html>
<html>
<meta charset="utf-8">
<title>head.html</title>
<script type="speculationrules">
{"prefetch":[{"source":"document","where":{"href_matches":"target.html*"},"eagerness":"immediate"}]}
</script>
<script>
  // Unique per visit, so a cache hit on the target can only be a prefetch.
  const TARGET = "target.html?item=head&n=" + Date.now();
  function setTargetLink() {
    document.getElementById("go").href = TARGET;
    document.getElementById("turl").textContent = TARGET;
  }
</script>
<style>
  body { font: 16px system-ui; margin: 40px; max-width: 760px; }
  pre { background: #eee; padding: 10px; overflow-x: auto; }
  a.target { font-size: 26px; }
</style>
<body>
<h1>head.html</h1>
<p>Document rule in <b>&lt;head&gt;</b>, link in <b>&lt;body&gt;</b>.</p>
<pre>&lt;script type="speculationrules"&gt;
{"prefetch":[{"source":"document","where":{"href_matches":"target.html*"},"eagerness":"immediate"}]}
&lt;/script&gt;</pre>
<p>Wait about 2 s, then click:</p>
<p><a id="go" class="target">Go to target</a></p>
<p>Target this visit: <code id="turl"></code></p>
<script>setTargetLink()</script>
<p><a href="index.html">back to index</a></p>
</body>
</html>
